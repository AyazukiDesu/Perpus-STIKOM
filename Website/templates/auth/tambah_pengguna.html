{% extends "layout/base.html" %}
{% block title %}Tambah Pengguna{% endblock %}
{% block content %}
<div class="card" style="max-width:450px;">
  <h2>Tambah Pengguna</h2>
  <form method="POST">
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" name="nama_lengkap" required>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" data-toggle-pw required autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>Role</label>
      <select name="role">
        <option value="staf">Staf</option>
        <option value="kepala_perpustakaan">Kepala Perpustakaan</option>
        <option value="mahasiswa">Mahasiswa</option>
      </select>
    </div>
    <div class="form-group">
      <label>NISN <small style="color:var(--muted);">(wajib untuk mahasiswa, {{ config.NISN_PANJANG }} digit)</small></label>
      <input type="text" name="nisn" inputmode="numeric" maxlength="{{ config.NISN_PANJANG }}" pattern="\d*">
    </div>
    <button class="btn" type="submit">Simpan</button>
    <a href="{{ url_for('auth.daftar_pengguna') }}" class="btn btn-ghost">Batal</a>
  </form>
</div>
{% endblock %}
