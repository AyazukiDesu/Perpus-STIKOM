{% extends "layout/base.html" %}
{% block title %}Pinjamkan Buku{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
  <h2>Pinjamkan Buku: {{ buku.judul }}</h2>
  <p>Stok tersedia: <strong>{{ buku.stok }}</strong></p>
  <form method="POST">
    <div class="form-group">
      <label>Pilih Anggota</label>
      <select name="user_id" required>
        <option value="">- Pilih Anggota -</option>
        {% for a in anggota_list %}
          <option value="{{ a.id }}">{{ a.nama_lengkap }} ({{ a.username }})</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn" type="submit">Proses Peminjaman</button>
    <a href="{{ url_for('buku.detail_buku', buku_id=buku.id) }}" class="btn btn-sm" style="background:#888;">Batal</a>
  </form>
</div>
{% endblock %}
